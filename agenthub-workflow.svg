<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">AgentHub application workflow</title>
  <desc id="desc">A high-level view of the browser shell, feature views, API routes, domain engines, local model providers, workspace permissions, and local persistence in AgentHub.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#e2e8f0}.title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#94a3b8}.lane{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#94a3b8}.head{font-size:16px;font-weight:650}.body{font-size:13px;fill:#cbd5e1}.small{font-size:11px;fill:#94a3b8}.box{fill:#111827;stroke:#334155;stroke-width:1.5}.browser{fill:#172554;stroke:#3b82f6}.feature{fill:#102a43;stroke:#38bdf8}.api{fill:#1e293b;stroke:#a78bfa}.engine{fill:#172b26;stroke:#34d399}.store{fill:#30251a;stroke:#f59e0b}.connector{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 6}
    </style>
  </defs>
  <rect width="1440" height="980" rx="22" fill="#080d18"/>
  <text x="56" y="58" class="title">AgentHub · application workflow</text>
  <text x="56" y="84" class="subtitle">Browser interface → API routes → domain logic → model providers, workspace tools, and local data</text>

  <text x="56" y="125" class="lane">PRESENTATION</text>
  <rect x="56" y="145" width="1328" height="118" rx="16" fill="#0d1728" stroke="#1e293b"/>
  <rect x="82" y="169" width="300" height="70" rx="12" class="box browser"/>
  <text x="106" y="197" class="head">User · Browser</text><text x="106" y="220" class="body">URL selects view · local profile and theme</text>
  <path d="M382 204 H470" class="connector"/>
  <rect x="482" y="169" width="340" height="70" rx="12" class="box browser"/>
  <text x="506" y="197" class="head">Shell</text><text x="506" y="220" class="body">Navigation · profile · shared app state</text>
  <path d="M822 204 H902" class="connector"/>
  <rect x="914" y="169" width="430" height="70" rx="12" class="box browser"/>
  <text x="938" y="197" class="head">Feature views</text><text x="938" y="220" class="body">Chat · Sessions · Auto · Agents · Playground · other views</text>

  <text x="56" y="305" class="lane">HTTP BOUNDARY</text>
  <rect x="56" y="324" width="1328" height="132" rx="16" fill="#0d1728" stroke="#1e293b"/>
  <path d="M1100 239 V296 H310 V344" class="connector"/>
  <path d="M1100 296 H720 V344" class="connector"/>
  <path d="M1100 296 H1130 V344" class="connector"/>
  <rect x="110" y="344" width="400" height="82" rx="12" class="box api"/>
  <text x="136" y="374" class="head">Chat API · /api/chat</text><text x="136" y="399" class="body">Validate prompt · resolve model · stream response</text>
  <rect x="520" y="344" width="400" height="82" rx="12" class="box api"/>
  <text x="546" y="374" class="head">Session APIs</text><text x="546" y="399" class="body">Conversation · workspace · permission endpoints</text>
  <rect x="930" y="344" width="400" height="82" rx="12" class="box api"/>
  <text x="956" y="374" class="head">Auto computer APIs</text><text x="956" y="399" class="body">Task requests · status · approvals · computer bridge</text>

  <text x="56" y="500" class="lane">DOMAIN LOGIC</text>
  <rect x="56" y="519" width="1328" height="176" rx="16" fill="#0d1728" stroke="#1e293b"/>
  <path d="M310 426 V552" class="connector"/><path d="M720 426 V552" class="connector"/><path d="M1130 426 V552" class="connector"/>
  <rect x="110" y="552" width="400" height="105" rx="12" class="box engine"/>
  <text x="136" y="581" class="head">Chat runtime</text><text x="136" y="606" class="body">chat-runs owns stream, optimistic turns, pause/stop</text><text x="136" y="630" class="body">chat-store serializes conversation history</text>
  <rect x="520" y="552" width="400" height="105" rx="12" class="box engine"/>
  <text x="546" y="581" class="head">Session engine</text><text x="546" y="606" class="body">Runner · runtime · tools · workspace path checks</text><text x="546" y="630" class="body">Session store keeps conversation and execution state</text>
  <rect x="930" y="552" width="400" height="105" rx="12" class="box engine"/>
  <text x="956" y="581" class="head">Computer runtime</text><text x="956" y="606" class="body">Plan → inspect → request approval → act → verify</text><text x="956" y="630" class="body">Protocol and optional Windows/Python companion</text>

  <text x="56" y="738" class="lane">PROVIDERS AND LOCAL RESOURCES</text>
  <rect x="56" y="757" width="1328" height="168" rx="16" fill="#0d1728" stroke="#1e293b"/>
  <path d="M310 657 V710 H342 V776" class="connector"/><path d="M720 657 V710 H738 V776" class="connector"/><path d="M1130 657 V710 H1080 V776" class="connector"/>
  <rect x="110" y="776" width="400" height="104" rx="12" class="box store"/>
  <text x="136" y="806" class="head">Model routing</text><text x="136" y="831" class="body">LM Studio · Ollama · configured custom model</text><text x="136" y="855" class="small">Auto selects an available compatible provider</text>
  <rect x="520" y="776" width="400" height="104" rx="12" class="box store"/>
  <text x="546" y="806" class="head">Local JSON persistence</text><text x="546" y="831" class="body">Chats · sessions · dashboard and feature state</text><text x="546" y="855" class="small">Atomic writes; domain stores own their data</text>
  <rect x="930" y="776" width="400" height="104" rx="12" class="box store"/>
  <text x="956" y="806" class="head">Workspace and desktop</text><text x="956" y="831" class="body">Selected folder · permission gates · user approvals</text><text x="956" y="855" class="small">App control is separate from chat model inference</text>
  <text x="56" y="955" class="small">One Next.js App Router application · optional desktop companion · terminal agent is a separate package</text>
</svg>
